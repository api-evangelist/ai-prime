name: AI-Prime (Paidao Intelligence)
description: 'AI-Prime (Paidao Intelligence / 湃道智能) is a Shanghai-based industrial-safety
  AI company founded in 2017 that builds computer-vision, deep-learning, and knowledge-graph
  platforms for high-hazard industries. Its full-stack products span an AI industrial-safety
  monitoring cloud platform, 40+ safety-scenario models (PPE detection, unsafe behavior,
  equipment leaks, fire/smoke, work-process compliance), a self-learning AI model-development
  platform, and Prime-Edge smart hardware (edge-computing boxes, inspection robots, AR
  work mirrors, and edge cameras) serving the chemical, steel, coal, oil & gas, energy,
  and mining sectors. AI-Prime is a portfolio company of Qiming Venture Partners. It is
  an enterprise B2B provider with no public developer API program; this profile captures
  its identity and web presence.'
